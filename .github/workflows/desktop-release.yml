name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify release tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) echo "Desktop production releases require a stable semantic version."; exit 1 ;;
          esac
          test "$GITHUB_REF_NAME" = "v$VERSION"
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git fetch origin main
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: desktop:release:mac
            artifact: desktop-macos
            platform: mac
          - os: windows-latest
            command: desktop:release:win
            artifact: desktop-windows
            platform: win
          - os: ubuntu-latest
            command: desktop:release:linux
            artifact: desktop-linux
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build desktop packages
        run: npm run ${{ matrix.command }}
      - name: Validate update artifacts and metadata
        run: npm run desktop:validate-release -- ${{ matrix.platform }} dist/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.blockmap
            dist/desktop/*.deb
            dist/desktop/*.dmg
            dist/desktop/*.exe
            dist/desktop/latest*.yml
            dist/desktop/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate complete release payload
        run: node desktop/validate-release.cjs all release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Darkwind ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
